[workspace]
members = ["crates/wccs-inventory", "crates/wccs-session"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
windows = "=0.61.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
