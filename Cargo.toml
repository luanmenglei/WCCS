[workspace]
members = ["crates/wccs-inventory", "crates/wccs-session", "crates/wccs-protocol", "crates/wccs-server", "crates/wccs-agent"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
windows = "=0.61.3"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rand = "=0.8.5"
sha2 = "=0.10.9"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
